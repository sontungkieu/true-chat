[project]
name = "true-chat-rag-bench"
version = "0.1.0"
description = "Small RAG benchmark CLI with Groq round-robin API key support."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "groq>=0.11.0",
    "ir-datasets>=0.5.8",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
vector = [
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=3.0.0",
]
ragas = [
    "datasets>=2.18.0",
    "langchain-groq>=0.1.0",
    "ragas>=0.2.0",
]

[project.scripts]
rag-bench = "rag_bench.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
