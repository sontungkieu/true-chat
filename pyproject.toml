[project]
name = "true-chat-rag-bench"
version = "0.1.0"
description = "Small RAG benchmark CLI with Groq round-robin API key support."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "groq==0.37.1",
    "ir-datasets==0.5.11",
    "numpy==2.2.6; python_version < '3.11'",
    "numpy==2.4.4; python_version >= '3.11'",
    "rank-bm25==0.2.2",
    "scikit-learn==1.7.2; python_version < '3.11'",
    "scikit-learn==1.8.0; python_version >= '3.11'",
]

[project.optional-dependencies]
vector = [
    "faiss-cpu==1.13.2",
    "sentence-transformers==5.4.1",
]
ragas = [
    "datasets==4.8.5",
    "langchain-groq==1.1.2",
    "ragas==0.4.3",
]

[project.scripts]
rag-bench = "rag_bench.cli:main"

[dependency-groups]
dev = [
    "pytest==9.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
