        element.appendChild(renderRichRun(run, highlights, options));
      }
      return element;
    }

    function renderRichRun(run, highlights = [], options = {}) {
      const tag = run.superscript ? "sup" : run.subscript ? "sub" : "span";
      const element = document.createElement(tag);
      element.className = "rich-run";
      appendHighlightedText(element, run.text || "", highlights, options);
      if (run.bold) element.style.fontWeight = "700";
      if (run.italic) element.style.fontStyle = "italic";
      const decorations = [];
      if (run.underline) decorations.push("underline");
      if (run.strike) decorations.push("line-through");
      if (decorations.length) element.style.textDecoration = decorations.join(" ");
      if (typeof run.color === "string" && /^[0-9a-fA-F]{6}$/.test(run.color)) {
        element.style.color = "#" + run.color;
      }
      if (run.highlight && run.highlight !== "none") element.dataset.highlight = String(run.highlight);
      return element;
    }

    function appendHighlightedText(container, text, highlights = [], options = {}) {
      const value = String(text || "");
      const ranges = highlightRanges(value, highlights, options);
      if (!ranges.length) {
        container.appendChild(document.createTextNode(value));
        return;
      }
      let cursor = 0;
      for (const range of ranges) {
        if (range.start > cursor) container.appendChild(document.createTextNode(value.slice(cursor, range.start)));
        const mark = document.createElement("span");
        const term = value.slice(range.start, range.end);
        mark.className = "query-highlight" + (options.crossRefs ? " xref-term" : "");
        mark.textContent = term;
        if (options.crossRefs) {
          mark.dataset.dictionaryXref = term;
          mark.title = t("dictionaryCrossRefHint");
          mark.tabIndex = 0;
          mark.setAttribute("role", "button");
        }
        container.appendChild(mark);
        cursor = range.end;
      }
      if (cursor < value.length) container.appendChild(document.createTextNode(value.slice(cursor)));
    }

    function highlightRanges(text, highlights = [], options = {}) {
      const foldedText = options.strictHighlights ? strictForMatchWithMap(text) : foldForMatchWithMap(text);
      if (!foldedText.folded) return [];
      const terms = highlights
        .map((term) => (options.strictHighlights ? strictForMatchWithMap(term) : foldForMatchWithMap(term)).folded)
        .filter(Boolean)
        .sort((a, b) => b.length - a.length);
      const ranges = [];
      for (const term of terms) {
        let index = foldedText.folded.indexOf(term);
        while (index !== -1) {
          const endIndex = index + term.length - 1;
          if (isHighlightBoundary(foldedText.folded, index - 1) && isHighlightBoundary(foldedText.folded, index + term.length)) {
            const start = foldedText.map[index];
            const end = (foldedText.map[endIndex] ?? start) + 1;
            if (!ranges.some((range) => start < range.end && end > range.start)) {
              ranges.push({ start, end });
            }
          }
          index = foldedText.folded.indexOf(term, index + Math.max(1, term.length));
        }
      }
      return ranges.sort((a, b) => a.start - b.start || a.end - b.end);
    }

    function isHighlightBoundary(folded, index) {
      return index < 0 || index >= folded.length || folded[index] === " ";
    }

    function strictForMatchWithMap(value) {
      const text = String(value || "");
      let folded = "";
      const map = [];
      let pendingSpace = false;
      let pendingSpaceIndex = 0;
      for (let index = 0; index < text.length; index += 1) {
        const char = text[index].toLowerCase();
        if (!/[\p{L}\p{M}\p{N}]/u.test(char)) {
          if (folded) {
            pendingSpace = true;
            pendingSpaceIndex = index;
          }
          continue;
        }
        if (pendingSpace && folded && !folded.endsWith(" ")) {
          folded += " ";
          map.push(pendingSpaceIndex);
        }
        pendingSpace = false;
        folded += char;
        map.push(index);
      }
      return { folded: folded.trim(), map };
    }

    function foldForMatchWithMap(value) {
      const text = String(value || "");
      let folded = "";
      const map = [];
      let pendingSpace = false;
      let pendingSpaceIndex = 0;
      for (let index = 0; index < text.length; index += 1) {
        const raw = text[index] === "đ" || text[index] === "Đ"
          ? "dd"
          : text[index].toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        const chars = raw.replace(/[^a-z0-9]+/g, " ");
        for (const char of chars) {
          if (char === " ") {
            if (folded) {
              pendingSpace = true;
              pendingSpaceIndex = index;
            }
            continue;
          }
          if (pendingSpace && folded && !folded.endsWith(" ")) {
            folded += " ";
            map.push(pendingSpaceIndex);
          }
          pendingSpace = false;
          folded += char;
          map.push(index);
        }
      }
      return { folded: folded.trim(), map };
    }

    function imageSource(source) {
      return source?.image_data_url || source?.image_url || source?.metadata?.image_data_url || source?.metadata?.image_url || "";
    }

    function imageSources(sources) {
      return (sources || []).filter((source) => imageSource(source));
    }

    function textSources(sources) {
      return (sources || []).filter((source) => !imageSource(source));
    }

    function openImageLightbox(source) {
      const image = imageSource(source);
      if (!image) return;
      lightboxImage.src = image;
      lightboxImage.alt = source.title || source.doc_id || t("source");
      imageLightbox.classList.add("show");
    }

    function closeImageLightbox() {
      imageLightbox.classList.remove("show");
      lightboxImage.removeAttribute("src");
      lightboxImage.alt = "";
    }

    function isSelectedSource(source) {
      return Boolean(selectedSource && selectedSource.doc_id === source.doc_id && selectedSource.rank === source.rank);
    }

    function formatMeta(meta) {
      const parts = [];
      if (settings.devMode) {
        const commit = shortMessageCommit(meta);
        if (commit) parts.push("commit " + commit);
        if (meta.key_alias) parts.push("key " + meta.key_alias);
        if (Array.isArray(meta.rejected_aliases) && meta.rejected_aliases.length) {
          parts.push("rejected " + meta.rejected_aliases.join(", "));
        }
        if (Number.isFinite(meta.retry_count)) parts.push("retries " + meta.retry_count);
        if (Number.isFinite(meta.scheduled_wait_s) && meta.scheduled_wait_s > 0) {
          parts.push("wait " + meta.scheduled_wait_s.toFixed(2) + "s");
        }
      }
      if (Number.isFinite(meta.output_tokens_per_s)) {
        parts.push(meta.output_tokens_per_s.toFixed(1) + " tok/s");
      }
      const privacyTier = meta.privacy?.state?.session_taint || meta.privacy?.session_taint;
      if (privacyTier === "private") parts.push(t("privacyPrivate"));
      else if (privacyTier === "semi_private") parts.push(t("privacySemiPrivate"));
      return parts.join(" | ");
    }

    async function sendNewUserMessage(text) {
      const conversation = activeConversation();
      saveSettingsFromInputs();
      const userMessage = { role: "user", content: text, request: captureRequestOptions(text) };
      conversation.messages.push(userMessage);
      if (!conversation.title || conversation.title === "New chat" || conversation.title === "Chat mới") {
        conversation.title = titleFrom(text);
      }
      await requestAssistant(conversation, conversation.messages.length - 1);
    }

    async function submitEditedUserMessage(text) {
      if (activeController) return;
      const conversation = activeConversation();
      const index = editingUserIndex;
      if (index === null || !conversation.messages[index] || conversation.messages[index].role !== "user") {
        clearEditMode();
        await sendNewUserMessage(text);
        return;
      }
      conversation.messages = conversation.messages.slice(0, index + 1);
      saveSettingsFromInputs();
      conversation.messages[index] = { role: "user", content: text, request: captureRequestOptions(text) };
      if (index === firstUserMessageIndex(conversation)) {
        conversation.title = titleFrom(text);
      }
      conversation.updatedAt = Date.now();
      clearEditMode();
      closeDocPanel();
      saveState();
      await requestAssistant(conversation, index);
    }

    function editUserMessage(index) {
      if (activeController) return;
      const conversation = activeConversation();
      const message = conversation.messages[index];
      if (!message || message.role !== "user") return;
      editingUserIndex = index;
      promptInput.value = message.content || "";
      composer.classList.add("editing");
      closeDocPanel();
      resizePrompt();
      promptInput.focus();
    }

    function editAssistantFeedback(index) {
      const conversation = activeConversation();
      const message = conversation.messages[index];
      if (!message || message.role !== "assistant") return;
      const current = String(message.feedback?.note || "");
      const next = window.prompt(t("feedbackPrompt"), current);
      if (next === null) return;
      const note = next.trim();
      if (!note) {
        delete message.feedback;
      } else {
        message.feedback = {
          note,
          createdAt: message.feedback?.createdAt || new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };
      }
      conversation.updatedAt = Date.now();
      saveState();
      render();
    }

    function clearEditMode() {
      editingUserIndex = null;
      composer.classList.remove("editing");
    }

    function cancelEditMode() {
      clearEditMode();
      promptInput.value = "";
      resizePrompt();
      promptInput.focus();
    }

    function firstUserMessageIndex(conversation) {
      return conversation.messages.findIndex((message) => message.role === "user");
    }

    async function retryFrom(assistantIndex) {
      if (activeController) return;
      const conversation = activeConversation();
      let userIndex = assistantIndex - 1;
      while (userIndex >= 0 && conversation.messages[userIndex].role !== "user") userIndex--;
      if (userIndex < 0) return;
      conversation.messages = conversation.messages.slice(0, userIndex + 1);
      await requestAssistant(conversation, userIndex);
    }

    async function requestAssistant(conversation, userIndex) {
      hideNotice();
      const userMessage = conversation.messages[userIndex];
      const requestOptions = userMessage?.request || captureRequestOptions(userMessage?.content || "");
      const requestCommit = requestOptions.runtime_commit || runtimeCommit() || "";
      if (requestCommit) requestOptions.runtime_commit = requestCommit;
      if (userMessage && userMessage.role === "user") userMessage.request = requestOptions;
      const assistant = {
        role: "assistant",
        content: "",
        pending: true,
        sources: [],
        meta: requestCommit ? { runtime_commit: requestCommit } : null
      };
      conversation.messages.push(assistant);
      conversation.updatedAt = Date.now();
      saveState();
      render();
      setSending(true);

      activeController = new AbortController();
      const apiMessages = conversation.messages
        .slice(0, -1)
        .filter((message) => (message.role === "user" || message.role === "assistant") && message.content)
        .map((message) => ({ role: message.role, content: message.content }));

      try {
        const result = await fetchAssistant(conversation, apiMessages, activeController.signal, requestOptions);
        assistant.content = result.content || t("emptyAnswer");
        assistant.sources = result.sources || [];
        assistant.meta = mergeMessageMeta({ runtime_commit: requestCommit }, result.meta);
        conversation.privacyState = result.privacyState || conversation.privacyState || null;
      } catch (error) {
        if (error.name === "AbortError") {
          assistant.content = assistant.content || t("stopped");
        } else {
          assistant.content = t("errorPrefix") + error.message;
          showNotice(error.message);
        }
      } finally {
        assistant.pending = false;
        activeController = null;
        conversation.updatedAt = Date.now();
        saveState();
        render();
        setSending(false);
        promptInput.focus();
      }
    }

    async function fetchAssistant(conversation, apiMessages, signal, requestOptions) {
      const response = await fetch("/v1/chat/completions", {
        method: "POST",
        headers: apiHeaders(),
        signal,
        body: JSON.stringify({
          model: requestOptions.model,
          retriever: requestOptions.retriever,
          messages: apiMessages,
          temperature: requestOptions.temperature,
          max_tokens: requestOptions.max_tokens,
          top_k: requestOptions.top_k,
          score_min: requestOptions.score_min,
          score_max: requestOptions.score_max,
          sort_by_score: requestOptions.sort_by_score,
          image_top_k: requestOptions.image_top_k,
          response_mode: requestOptions.response_mode,
          image_rewrite: requestOptions.image_rewrite,
          language: requestOptions.language,
          memory: requestOptions.memory,
          session_id: conversation.id,
          privacy_state: conversation.privacyState || undefined,
          stream: true
        })
      });
      if (!response.ok) {
        throw new Error(await responseError(response));
      }
      if (!response.body) {
        const data = await response.json();
        return resultFromJson(data);
      }
      const streamed = await readSseResponse(response, signal);
      if (streamed.content && streamed.content.trim()) return streamed;
      return fetchAssistantJson(conversation, apiMessages, signal, requestOptions);
    }

    async function fetchAssistantJson(conversation, apiMessages, signal, requestOptions) {
      const response = await fetch("/v1/chat/completions", {
        method: "POST",
        headers: apiHeaders(),
        signal,
        body: JSON.stringify({
          model: requestOptions.model,
          retriever: requestOptions.retriever,
          messages: apiMessages,
          temperature: requestOptions.temperature,
          max_tokens: requestOptions.max_tokens,
          top_k: requestOptions.top_k,
          score_min: requestOptions.score_min,
          score_max: requestOptions.score_max,
          sort_by_score: requestOptions.sort_by_score,
          image_top_k: requestOptions.image_top_k,
          response_mode: requestOptions.response_mode,
          image_rewrite: requestOptions.image_rewrite,
          language: requestOptions.language,
          memory: requestOptions.memory,
          session_id: conversation.id,
          privacy_state: conversation.privacyState || undefined,
          stream: false
        })
      });
      if (!response.ok) {
        throw new Error(await responseError(response));
      }
      return resultFromJson(await response.json());
    }

    function apiHeaders() {
      const headers = { "Content-Type": "application/json" };
      if (settings.apiKey) headers.Authorization = "Bearer " + settings.apiKey;
      return headers;
    }

    async function readSseResponse(response, signal) {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let content = "";
      let rag = null;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        if (signal.aborted) throw new DOMException("Aborted", "AbortError");
        buffer += decoder.decode(value, { stream: true }).replace(/\r\n/g, "\n");
        const events = buffer.split("\n\n");
        buffer = events.pop() || "";
        for (const event of events) {
          const parsed = parseSseEvent(event);
          if (!parsed) continue;
          if (parsed.rag) rag = parsed.rag;
          const delta = parsed.choices?.[0]?.delta || {};
          if (delta.content) {
            content += delta.content;
            if (shouldRenderStreamingDelta(delta.content)) {
              updatePendingAssistant(content, rag);
            }
          }
          const messageContent = parsed.choices?.[0]?.message?.content;
          if (messageContent && !content) {
            content = messageContent;
            if (shouldRenderStreamingDelta(messageContent)) {
              updatePendingAssistant(content, rag);
            }
          }
          if (parsed.answer && !content) {
            content = parsed.answer;
            if (shouldRenderStreamingDelta(parsed.answer)) {
              updatePendingAssistant(content, rag);
            }
          }
          if (parsed.rag && content) {
            updatePendingAssistant(content, rag);
          }
        }
      }
      if (buffer.trim()) {
        const parsed = parseSseEvent(buffer);
        if (parsed?.rag) rag = parsed.rag;
        if (parsed?.answer && !content) content = parsed.answer;
      }
      return resultFromContentAndRag(content, rag);
    }

    function shouldRenderStreamingDelta(text) {
      return String(text || "").length <= 480;
    }

    function parseSseEvent(event) {
      const dataLines = event
        .split("\n")
        .filter((line) => line.startsWith("data:"))
        .map((line) => line.slice(5).trimStart());
      if (!dataLines.length) return null;
      const data = dataLines.join("\n").trim();
      if (!data || data === "[DONE]") return null;
      return JSON.parse(data);
    }

    function updatePendingAssistant(content, rag = null) {
      const conversation = activeConversation();
      const pending = conversation.messages.findLast
        ? conversation.messages.findLast((message) => message.pending)
        : [...conversation.messages].reverse().find((message) => message.pending);
      if (!pending) return;
      pending.content = content;
      if (rag) {
        const result = resultFromContentAndRag(content, rag);
        pending.sources = result.sources || [];
        pending.meta = mergeMessageMeta(pending.meta, result.meta);
        conversation.privacyState = result.privacyState || conversation.privacyState || null;
      }
      saveState();
      renderChat();
    }

    async function responseError(response) {
      try {
        const data = await response.json();
        if (data.detail && typeof data.detail === "object") {
          return data.detail.message || JSON.stringify(data.detail);
        }
        return data.detail || response.statusText || "Request failed";
      } catch (_) {
        return response.statusText || "Request failed";
      }
    }

    function resultFromJson(data) {
      const content = data.choices?.[0]?.message?.content || "";
      return resultFromContentAndRag(content, data.rag || null);
    }

    function resultFromContentAndRag(content, rag) {
      return {
        content,
        sources: rag?.retrieved || [],
        privacyState: rag?.privacy?.state || null,
        meta: rag
          ? {
              key_alias: rag.key_alias,
              rejected_aliases: rag.rejected_aliases || [],
              retry_count: rag.retry_count,
              scheduled_wait_s: rag.scheduled_wait_s,
              output_tokens_per_s: rag.output_tokens_per_s,
              privacy: rag.privacy || null
            }
          : null
      };
    }

    function mergeMessageMeta(base, extra) {
      const merged = {};
      if (base && typeof base === "object") Object.assign(merged, base);
      if (extra && typeof extra === "object") Object.assign(merged, extra);
      if (!merged.runtime_commit) delete merged.runtime_commit;
      return Object.keys(merged).length ? merged : null;
    }

    function setSending(isSending) {
      sendButton.innerHTML = isSending ? ICONS.stop : ICONS.send;
      sendButton.title = isSending ? t("stop") : t("send");
      sendButton.setAttribute("aria-label", isSending ? t("stop") : t("send"));
      sendButton.classList.toggle("stop", isSending);
    }

    function resizePrompt() {
      promptInput.style.height = "auto";
      promptInput.style.height = Math.min(promptInput.scrollHeight, 190) + "px";
      updateComposerReservedHeight();
    }

    function titleFrom(text) {
      const compact = text.replace(/\\s+/g, " ").trim();
      return compact.length > 42 ? compact.slice(0, 42) + "..." : compact || t("newChatTitle");
    }

    function copyText(text) {
      if (!text) return;
      navigator.clipboard?.writeText(text).catch(() => {});
    }

    function showNotice(message) {
      notice.textContent = message;
      notice.classList.add("show");
    }

    function hideNotice() {
      notice.textContent = "";
      notice.classList.remove("show");
    }
  </script>
</body>
</html>
