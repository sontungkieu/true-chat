        const check = document.createElement("span");
        check.className = "model-check";
        check.textContent = value.value === selected ? "✓" : "";
        option.append(label, check);
        option.addEventListener("click", () => {
          if (kind === "model") {
            settings.model = normalizeModelChoice(value.value);
            modelChoiceInput.value = settings.model;
          } else if (kind === "mode") {
            settings.responseMode = normalizeResponseMode(value.value);
          } else {
            settings.search = normalizeSearchChoice(value.value);
            searchChoiceInput.value = settings.search;
          }
          saveSettingsFromInputs();
          closeComposerToolMenu();
          promptInput.focus();
        });
        composerToolMenu.appendChild(option);
      }
    }

    function populateSearchChoices() {
      searchChoiceInput.textContent = "";
      for (const retriever of TEXT_RETRIEVER_CHOICES) {
        const option = document.createElement("option");
        option.value = retriever;
        option.textContent = retrieverLabel(retriever);
        option.title = retrieverTitle(retriever);
        searchChoiceInput.appendChild(option);
      }
      if (activeComposerMenu === "search") renderComposerToolMenu("search");
    }

    function defaultModelChoice() {
      if (MODEL_CHOICES.includes(DEFAULT_CHAT_MODEL)) return DEFAULT_CHAT_MODEL;
      return MODEL_CHOICES[0] || "llama-3.1-8b-instant";
    }

    function normalizeModelChoice(model) {
      return MODEL_CHOICES.includes(model) ? model : defaultModelChoice();
    }

    function selectedModel() {
      return normalizeModelChoice(settings.model);
    }

    function normalizeSearchChoice(retriever) {
      const normalized = String(retriever || "").trim().toLowerCase();
      return TEXT_RETRIEVER_CHOICES.includes(normalized) ? normalized : TEXT_RETRIEVER_CHOICES[0];
    }

    function selectedRetriever() {
      return normalizeSearchChoice(settings.search);
    }

    function responseModeChoices() {
      return [
        { value: "text", label: currentLanguage() === "vi" ? "Chỉ text" : "Text only" },
        { value: "text_image", label: currentLanguage() === "vi" ? "Text + ảnh" : "Text + images" },
        { value: "image", label: currentLanguage() === "vi" ? "Chỉ ảnh" : "Images only" },
        { value: "dictionary", label: t("dictionary") }
      ];
    }

    function normalizeResponseMode(value) {
      const normalized = String(value || "text").trim().toLowerCase().replace("+", "_").replace("-", "_");
      if (["image", "images", "img"].includes(normalized)) return "image";
      if (["text_image", "text_images", "text_and_image", "text_and_images", "mixed"].includes(normalized)) return "text_image";
      if (["dictionary", "dict", "tu_dien", "từ_điển"].includes(normalized)) return "dictionary";
      return "text";
    }

    function selectedResponseMode() {
      return normalizeResponseMode(settings.responseMode);
    }

    function responseModeLabel(mode) {
      const value = normalizeResponseMode(mode);
      return responseModeChoices().find((choice) => choice.value === value)?.label || "Text only";
    }

    function updateModelLabels() {
      const model = selectedModel();
      const label = modelLabel(model);
      brandModel.textContent = label;
      brandModel.title = model;
      app.dataset.model = model;
      app.dataset.retriever = selectedRetriever();
      if (toolModel) toolModel.textContent = shortModelLabel(model);
      if (toolSearch) toolSearch.textContent = retrieverLabel(selectedRetriever());
      if (toolMode) toolMode.textContent = responseModeLabel(selectedResponseMode());
      updateComposerTools();
    }

    function updateComposerTools() {
      const mode = selectedResponseMode();
      const usesImages = mode === "image" || mode === "text_image";
      const usesTextRetrieval = mode !== "image" && mode !== "dictionary";
      const showsModel = mode !== "image" || settings.imageRewrite;
      responseModeButton.classList.toggle("active", usesImages || mode === "dictionary");
      responseModeButton.setAttribute("aria-expanded", activeComposerMenu === "mode" && !composerToolMenu.hidden ? "true" : "false");
      responseModeButton.title = responseModeLabel(mode);
      imageRewriteButton.hidden = !usesImages;
      imageRewriteButton.classList.toggle("active", usesImages && settings.imageRewrite);
      imageRewriteButton.setAttribute("aria-pressed", usesImages && settings.imageRewrite ? "true" : "false");
      searchToolButton.hidden = !usesTextRetrieval;
      modelToolButton.hidden = !showsModel;
      if (toolMode) toolMode.textContent = responseModeLabel(mode);
      if (toolSearch) toolSearch.textContent = retrieverLabel(selectedRetriever());
      if (toolModel) toolModel.textContent = shortModelLabel(selectedModel());
    }

    function toggleImageRewrite() {
      settings.imageRewrite = !settings.imageRewrite;
      updateComposerTools();
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
      promptInput.focus();
    }

    function isImageCommand(text) {
      return /^\s*\/(img|image)(\s|$)/i.test(text);
    }

    function isDictionaryCommand(text) {
      return /^\s*\/(dict|dictionary|tu-dien|từ-điển)(\s|$)/i.test(text);
    }

    function captureRequestOptions(text) {
      const explicitImageCommand = isImageCommand(text);
      const explicitDictionaryCommand = isDictionaryCommand(text);
      const responseMode = explicitImageCommand ? "image" : explicitDictionaryCommand ? "dictionary" : selectedResponseMode();
      const usesImageResults = responseMode === "image" || responseMode === "text_image" || explicitImageCommand;
      return {
        response_mode: responseMode,
        retriever: responseMode === "image" ? "image-digits" : responseMode === "dictionary" ? "dictionary-graph" : selectedRetriever(),
        model: selectedModel(),
        image_rewrite: responseMode === "image" || responseMode === "text_image" ? Boolean(settings.imageRewrite) : false,
        image_top_k: usesImageResults ? clampNumber(settings.imageTopK, 1, 20, 5) : undefined,
        top_k: settings.sourceTopK || undefined,
        score_min: settings.scoreMin ?? undefined,
        score_max: settings.scoreMax ?? undefined,
        sort_by_score: settings.sortByScore ? true : undefined,
        max_tokens: settings.maxTokens,
        temperature: settings.temperature,
        language: currentLanguage(),
        memory: settings.memory !== false,
        runtime_commit: runtimeCommit() || undefined
      };
    }

    function modelLabel(model) {
      if (model === "llama-3.1-8b-instant") return "Llama 3.1 8B Instant";
      if (model === "qwen/qwen3-32b") return "Qwen3 32B";
      if (model === "mimo-v2.5-pro") return "MiMo V2.5 Pro";
      if (model === "mimo-v2.5") return "MiMo V2.5";
      return model;
    }

    function shortModelLabel(model) {
      if (model === "llama-3.1-8b-instant") return "Llama 8B";
      if (model === "qwen/qwen3-32b") return "Qwen3 32B";
      if (model === "mimo-v2.5-pro") return "MiMo Pro";
      if (model === "mimo-v2.5") return "MiMo V2.5";
      return modelLabel(model);
    }

    function retrieverLabel(retriever) {
      if (retriever === "bm25") return "BM25";
      if (retriever === "tfidf") return "TF-IDF";
      if (retriever === "vector") return "Vector";
      if (retriever === "keyword-match") return "Keyword";
      if (retriever === "agent") return "Agent";
      if (retriever === "multi-query") return "Agent";
      if (retriever === "graph-bm25") return "Graph BM25";
      if (retriever === "dictionary-graph") return currentLanguage() === "vi" ? "Từ điển" : "Dictionary";
      if (retriever === "llm-query-rewrite") return "LLM rewrite";
      if (retriever === "llm-multi-query") return "LLM multi-query";
      if (retriever === "image-digits") return "Image digits";
      if (retriever === "hybrid-rrf") return "Hybrid RRF";
      if (retriever === "vector-rerank") return "Vector rerank";
      return retriever;
    }

    function retrieverTitle(retriever) {
      if (retriever === "agent") return "Agent";
      if (retriever === "multi-query") return "Agent";
      return retrieverLabel(retriever);
    }

    function normalizeLanguage(language) {
      return language === "vi" ? "vi" : "en";
    }

    function currentLanguage() {
      return normalizeLanguage(settings?.language);
    }

    function t(key) {
      return TEXT[currentLanguage()][key] || TEXT.en[key] || key;
    }

    function applyLocalization() {
      document.querySelectorAll("[data-i18n]").forEach((element) => {
        element.textContent = t(element.dataset.i18n);
      });
      apiKeyInput.placeholder = t("optional");
      promptInput.placeholder = t("sendMessage");
      const statusLabel = document.querySelector(".status-pill span:last-child");
      if (statusLabel) statusLabel.textContent = t("proxyReady");
      updateRuntimeVersion();
      populateModelChoices();
      populateSearchChoices();
      modelChoiceInput.value = selectedModel();
      searchChoiceInput.value = selectedRetriever();
      setSending(Boolean(activeController));
    }

    function applyTheme(theme) {
      if (theme === "system") {
        document.documentElement.removeAttribute("data-theme");
        return;
      }
      document.documentElement.dataset.theme = theme;
    }

    function applyFontScale(percent) {
      const safePercent = clampNumber(percent, 100, 200, 100);
      const scale = safePercent / 100;
      const rootStyle = document.documentElement.style;
      rootStyle.setProperty("--font-scale", String(scale));
      rootStyle.setProperty("--font-11", `${11 * scale}px`);
      rootStyle.setProperty("--font-12", `${12 * scale}px`);
      rootStyle.setProperty("--font-13", `${13 * scale}px`);
      rootStyle.setProperty("--font-14", `${14 * scale}px`);
      rootStyle.setProperty("--font-15", `${15 * scale}px`);
      rootStyle.setProperty("--font-hero-min", `${28 * scale}px`);
      rootStyle.setProperty("--font-hero-fluid", `${4 * scale}vw`);
      rootStyle.setProperty("--font-hero-max", `${38 * scale}px`);
      fontScaleValue.textContent = safePercent + "%";
    }

    function updateRuntimeVersion() {
      if (!runtimeVersion || !runtimeVersionValue) return;
      const version = runtimeCommit();
      runtimeVersion.hidden = !version;
      runtimeVersionValue.textContent = version;
      runtimeVersionValue.title = version;
    }

    function runtimeCommit() {
      return String(APP_VERSION || "").trim();
    }

    function shortRuntimeCommit() {
      return shortCommit(runtimeCommit());
    }

    function shortCommit(value) {
      const commit = String(value || "").trim();
      return commit.length > 12 ? commit.slice(0, 12) : commit;
    }

    function messageCommit(meta) {
      if (!meta || typeof meta !== "object") return "";
      if (meta.runtime_commit) return String(meta.runtime_commit).trim();
      if (meta.commit) return String(meta.commit).trim();
      const version = meta.version;
      if (version && typeof version === "object") {
        return String(version.actual_commit || version.expected_commit || "").trim();
      }
      return "";
    }

    function shortMessageCommit(meta) {
      return shortCommit(messageCommit(meta));
    }

    function clampNumber(value, min, max, fallback) {
      const number = Number(value);
      if (!Number.isFinite(number)) return fallback;
      return Math.min(max, Math.max(min, number));
    }

    function optionalClampedNumber(value, min, max) {
      if (value === null || value === undefined || String(value).trim() === "") return null;
      const number = Number(value);
      if (!Number.isFinite(number)) return null;
      return Math.min(max, Math.max(min, Math.round(number)));
    }

    function optionalFiniteNumber(value) {
      if (value === null || value === undefined || String(value).trim() === "") return null;
      const number = Number(value);
      return Number.isFinite(number) ? number : null;
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(compactStateForStorage(state)));
      } catch (error) {
        console.warn("Could not persist full chat state; retrying without source payloads.", error);
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(compactStateForStorage(state, { dropSources: true })));
        } catch (retryError) {
          console.warn("Could not persist chat state.", retryError);
        }
      }
    }

    function compactStateForStorage(sourceState, options = {}) {
      const conversations = Array.isArray(sourceState.conversations) ? sourceState.conversations : [];
      return {
        ...sourceState,
        conversations: conversations.map((conversation) => ({
          ...conversation,
          messages: Array.isArray(conversation.messages)
            ? conversation.messages.map((message) => compactMessageForStorage(message, options))
            : []
        }))
      };
    }

    function compactMessageForStorage(message, options = {}) {
      const compact = { ...message };
      if (Array.isArray(compact.sources)) {
        compact.sources = options.dropSources ? [] : compact.sources.map(compactSourceForStorage);
      }
      return compact;
    }

    function compactSourceForStorage(source) {
      const compact = { ...source };
      delete compact.rich_blocks;
      delete compact.raw_docx_text;
      if (compact.text && compact.text.length > 2400) {
        compact.text = compact.text.slice(0, 2400).trimEnd();
      }
      if (compact.metadata && typeof compact.metadata === "object") {
        compact.metadata = { ...compact.metadata };
        delete compact.metadata.rich_blocks;
        delete compact.metadata.raw_docx_text;
      }
      return compact;
    }

    function exportChatHistory() {
      const payload = {
        type: "rag-chat-history",
        schema_version: 1,
        exported_at: new Date().toISOString(),
        app: {
          model_id: MODEL_ID,
          available_models: MODEL_CHOICES,
          available_retrievers: RETRIEVER_CHOICES,
          storage_key: STORAGE_KEY
        },
        settings: settingsForExport(),
        state: JSON.parse(JSON.stringify(state))
      };
      downloadJson(payload, "true-chat-history-" + timestampForFilename() + ".json");
    }

    function settingsForExport() {
      const exported = { ...settings };
      delete exported.apiKey;
      return exported;
    }

    function downloadJson(payload, filename) {
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function timestampForFilename() {
      return new Date().toISOString().replace(/[:.]/g, "-");
    }

    async function importChatHistory(event) {
      const file = event.target.files?.[0];
      event.target.value = "";
      if (!file) return;
      try {
        const imported = normalizeImportedHistory(JSON.parse(await file.text()));
        mergeImportedHistory(imported);
        saveState();
        closeDocPanel();
        clearEditMode();
        render();
        showNotice(t("importChatsDone"));
      } catch (error) {
        console.warn("Could not import chat history.", error);
        showNotice(t("importChatsInvalid"));
      }
    }

    function normalizeImportedHistory(payload) {
      const importedState = payload?.state && typeof payload.state === "object" ? payload.state : payload;
      const conversations = Array.isArray(importedState?.conversations) ? importedState.conversations : [];
      const normalized = conversations.map(normalizeImportedConversation).filter(Boolean);
      if (!normalized.length) throw new Error("No conversations in import file.");
      const activeId = normalized.some((conversation) => conversation.id === importedState.activeId)
        ? importedState.activeId
        : normalized[0].id;
      return { conversations: normalized, activeId };
    }

    function normalizeImportedConversation(conversation) {
      if (!conversation || typeof conversation !== "object") return null;
      const messages = Array.isArray(conversation.messages)
        ? conversation.messages.map(normalizeImportedMessage).filter(Boolean)
        : [];
      return {
        id: String(conversation.id || ("import-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8))),
        title: String(conversation.title || "").slice(0, 120),
        createdAt: Number(conversation.createdAt) || Date.now(),
        updatedAt: Number(conversation.updatedAt) || Date.now(),
        privacyState: conversation.privacyState && typeof conversation.privacyState === "object" ? conversation.privacyState : null,
        messages
      };
    }

    function normalizeImportedMessage(message) {
      if (!message || typeof message !== "object") return null;
      const role = message.role === "assistant" ? "assistant" : message.role === "user" ? "user" : null;
      if (!role) return null;
      const normalized = {
        ...message,
        role,
        content: String(message.content || ""),
        pending: false
      };
      if (Array.isArray(message.sources)) normalized.sources = message.sources;
      if (message.request && typeof message.request === "object") normalized.request = message.request;
      if (message.meta && typeof message.meta === "object") normalized.meta = message.meta;
      if (message.feedback && typeof message.feedback === "object") normalized.feedback = message.feedback;
      return normalized;
    }

    function mergeImportedHistory(imported) {
      const importedIds = new Set(imported.conversations.map((conversation) => conversation.id));
      state.conversations = [
        ...imported.conversations,
        ...state.conversations.filter((conversation) => !importedIds.has(conversation.id))
      ].sort((a, b) => Number(b.updatedAt || 0) - Number(a.updatedAt || 0));
      state.activeId = imported.activeId;
    }

    function ensureConversation() {
      if (!state.conversations.length) {
        createConversation();
        return;
      }
      if (!state.conversations.some((item) => item.id === state.activeId)) {
        state.activeId = state.conversations[0].id;
      }
    }

    function createConversation() {
      const conversation = {
        id: "chat-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8),
        title: "",
        createdAt: Date.now(),
        updatedAt: Date.now(),
        privacyState: null,
        messages: []
      };
      state.conversations.unshift(conversation);
      state.activeId = conversation.id;
      saveState();
      return conversation;
    }

    function activeConversation() {
      ensureConversation();
      return state.conversations.find((item) => item.id === state.activeId);
    }

    function setActiveConversation(id) {
      state.activeId = id;
      saveState();
      closeMobileSidebar();
      closeDocPanel();
      clearEditMode();
      render();
    }

    function isNarrowViewport() {
      return window.matchMedia("(max-width: 840px)").matches;
    }

    function toggleSidebar() {
      if (isNarrowViewport()) {
        app.classList.add("sidebar-open");
        return;
      }
      app.classList.toggle("sidebar-collapsed");
    }

    function closeSidebar() {
      if (isNarrowViewport()) {
        closeMobileSidebar();
        return;
      }
      app.classList.add("sidebar-collapsed");
    }

    function closeMobileSidebar() {
      app.classList.remove("sidebar-open");
    }

    function startChatSwipe(event) {
      if (!isNarrowViewport()) return;
      if (app.classList.contains("sidebar-open") || app.classList.contains("doc-open")) return;
      if (event.touches.length !== 1) return;
      if (event.target.closest("button, input, select, textarea, summary, a")) return;
      const touch = event.touches[0];
      chatSwipeStart = {
        x: touch.clientX,
        y: touch.clientY,
        startedAt: Date.now()
      };
    }

    function endChatSwipe(event) {
      if (!chatSwipeStart || !isNarrowViewport()) {
        chatSwipeStart = null;
        return;
      }
      const touch = event.changedTouches[0];
      const dx = touch.clientX - chatSwipeStart.x;
      const dy = touch.clientY - chatSwipeStart.y;
      const elapsedMs = Date.now() - chatSwipeStart.startedAt;
      chatSwipeStart = null;
      if (dx < 78 || Math.abs(dy) > 54 || dx < Math.abs(dy) * 1.55 || elapsedMs > 800) return;
      app.classList.add("sidebar-open");
    }

    function cancelChatSwipe() {
      chatSwipeStart = null;
    }

    function render() {
      renderSidebar();
      renderPrivacyBadge();
      renderChat();
    }

    function renderPrivacyBadge() {
      if (!privacyBadge) return;
      const tier = String(activeConversation()?.privacyState?.session_taint || "public");
      privacyBadge.hidden = false;
      privacyBadge.classList.toggle("private", tier === "private");
      if (tier === "private") {
        privacyBadge.textContent = t("privacyPrivate");
      } else if (tier === "semi_private") {
        privacyBadge.textContent = t("privacySemiPrivate");
      } else {
        privacyBadge.textContent = t("privacyPublic");
      }
    }

    function renderSidebar() {
      conversationList.textContent = "";
      for (const conversation of state.conversations) {
        const row = document.createElement("div");
        row.className = "conversation" + (conversation.id === state.activeId ? " active" : "");

        const button = document.createElement("button");
        button.type = "button";
        button.className = "conversation-select";
        button.addEventListener("click", () => setActiveConversation(conversation.id));

        const title = document.createElement("span");
        title.className = "conversation-title";
        title.textContent = conversation.title || t("newChatTitle");
        button.appendChild(title);

        const count = document.createElement("span");
        count.className = "conversation-count";
        count.textContent = String(conversation.messages.filter((message) => message.role === "user").length);
        button.appendChild(count);

        const actions = document.createElement("div");
        actions.className = "conversation-actions";

        const renameButton = document.createElement("button");
        renameButton.type = "button";
        renameButton.className = "conversation-action";
        renameButton.title = t("renameChat");
        renameButton.setAttribute("aria-label", t("renameChat"));
        renameButton.innerHTML = ICONS.edit;
        renameButton.addEventListener("click", (event) => {
          event.stopPropagation();
          renameConversation(conversation.id);
        });

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "conversation-action danger conversation-delete";
        deleteButton.title = t("deleteChat");
        deleteButton.setAttribute("aria-label", t("deleteChat"));
        deleteButton.innerHTML = ICONS.trash;
        deleteButton.addEventListener("click", (event) => {
          event.stopPropagation();
          deleteConversation(conversation.id);
        });
        actions.append(renameButton, deleteButton);

        row.append(button, actions);
        conversationList.appendChild(row);
      }
    }

    function renameConversation(id) {
      const conversation = state.conversations.find((item) => item.id === id);
      if (!conversation) return;
      const currentTitle = conversation.title || t("newChatTitle");
      const nextTitle = window.prompt(t("renameChatPrompt"), currentTitle);
      if (nextTitle === null) return;
      const compact = nextTitle.replace(/\s+/g, " ").trim();
      if (!compact) return;
      conversation.title = compact.length > 80 ? compact.slice(0, 80) : compact;
      conversation.updatedAt = Date.now();
      saveState();
      renderSidebar();
    }

    function deleteConversation(id) {
      const index = state.conversations.findIndex((conversation) => conversation.id === id);
      if (index < 0) return;
      const deletingActive = state.activeId === id;
      state.conversations.splice(index, 1);
      if (!state.conversations.length) {
        createConversation();
      } else if (deletingActive) {
        const nextIndex = Math.min(index, state.conversations.length - 1);
        state.activeId = state.conversations[nextIndex].id;
      }
      if (deletingActive) closeDocPanel();
      if (deletingActive) clearEditMode();
      saveState();
      render();
      promptInput.focus();
    }

    function renderChat() {
      const conversation = activeConversation();
      updateModelLabels();
      chat.textContent = "";
      if (!conversation.messages.length) {
        chat.appendChild(renderWelcome());
        return;
      }

      const list = document.createElement("div");
      list.className = "messages";
      conversation.messages.forEach((message, index) => {
        list.appendChild(renderTurn(message, index));
      });
      chat.appendChild(list);
      chat.scrollTop = chat.scrollHeight;
    }

    function renderWelcome() {
      const wrapper = document.createElement("div");
      wrapper.className = "welcome";
      const inner = document.createElement("div");
      inner.className = "welcome-inner";
      const title = document.createElement("h1");
      title.textContent = t("welcomeTitle");
      const copy = document.createElement("p");
      copy.textContent = t("welcomeCopy");
      const grid = document.createElement("div");
      grid.className = "quick-grid";
      const prompts = t("quickPrompts");
      for (const [label, text] of prompts) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "quick";
        button.innerHTML = "<strong></strong><span></span>";
        button.querySelector("strong").textContent = label;
        button.querySelector("span").textContent = text;
        button.addEventListener("click", () => {
          promptInput.value = text;
          resizePrompt();
          promptInput.focus();
        });
        grid.appendChild(button);
      }
      inner.append(title, copy, grid);
      wrapper.appendChild(inner);
      return wrapper;
    }

    function renderTurn(message, index) {
      const turn = document.createElement("article");
      turn.className = "turn " + message.role;
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = message.role === "user" ? "U" : "R";

      const body = document.createElement("div");
      body.className = "message-body";
      const head = document.createElement("div");
      head.className = "message-head";
      const role = document.createElement("div");
      role.className = "role";
      role.textContent = message.role === "user" ? t("you") : t("assistant");
      head.appendChild(role);

      const bubble = document.createElement("div");
      bubble.className = "message-bubble";
      const content = document.createElement("div");
      content.className = "content" + (message.pending ? " pending" : "");
      const display = displayMessageContent(message);
      const sources = message.sources || [];
      const documentSources = textSources(sources);
      const images = imageSources(sources);
      const collapseDictionaryCards = message.role === "assistant" ? shouldCollapseDictionaryCardsForTurn(message, index) : false;
      bubble.appendChild(head);
      if (message.role === "assistant" && display.thinking.length) {
        bubble.appendChild(renderThinkDetails(display.thinking));
      }
      const emptyAnswerSection = message.role === "assistant" ? emptyAnswerSectionParts(display.answer) : null;
      const dictionaryAnswer = message.role === "assistant"
        ? dictionaryAnswerParts(display.answer, documentSources, {
            collapseAll: collapseDictionaryCards,
            allowExplicitSections: Boolean(emptyAnswerSection)
          })
        : null;
      if (dictionaryAnswer && emptyAnswerSection) {
        if (emptyAnswerSection.before) {
          const before = document.createElement("div");
          renderTextWithCitations(before, emptyAnswerSection.before, documentSources, { markdown: true });
          content.appendChild(before);
        }
        const heading = document.createElement("div");
        heading.className = "md-heading";
        appendInlineText(heading, emptyAnswerSection.heading, sourceLookup(documentSources), { markdown: true });
        content.appendChild(heading);
        content.appendChild(renderDictionaryAnswer(dictionaryAnswer));
        if (emptyAnswerSection.after) {
          const after = document.createElement("div");
          renderTextWithCitations(after, emptyAnswerSection.after, documentSources, { markdown: true });
          content.appendChild(after);
        }
      } else if (dictionaryAnswer) {
        bubble.appendChild(renderDictionaryAnswer(dictionaryAnswer));
        const explanation = dictionaryAnswer.explanation || (message.pending ? "" : display.fallback);
        if (explanation) {
          const explanationLabel = document.createElement("div");
          explanationLabel.className = "dictionary-explanation-label";
          explanationLabel.textContent = currentLanguage() === "vi" ? "Giải thích" : "Explanation";
          const explanationText = document.createElement("div");
          content.appendChild(explanationLabel);
          renderTextWithCitations(explanationText, explanation, documentSources, { markdown: true });
          content.appendChild(explanationText);
        }
      } else {
        renderTextWithCitations(
          content,
          display.answer || (message.pending ? "" : display.fallback),
          documentSources,
          { markdown: message.role === "assistant" }
        );
      }
      bubble.appendChild(content);
      if (message.role === "assistant" && images.length) {
        bubble.appendChild(renderImageGrid(images));
      }
      body.appendChild(bubble);
      if (message.role === "user" && settings.devMode && message.request) {
        body.appendChild(renderUserRequestMeta(message.request));
      }

      const footer = document.createElement("div");
      footer.className = "message-footer";
      const actions = document.createElement("div");
      actions.className = "message-actions";
      if (message.role === "assistant" && message.meta) {
        const formattedMeta = formatMeta(message.meta);
        if (formattedMeta) {
          const meta = document.createElement("div");
          meta.className = "meta-line";
          meta.textContent = formattedMeta;
          footer.appendChild(meta);
        }
      }
      actions.appendChild(actionButton("copy", () => copyText(copyableMessageContent(message))));
      if (message.role === "user") {
        actions.appendChild(actionButton("edit", () => editUserMessage(index)));
      }
      if (message.role === "assistant") {
        actions.appendChild(actionButton("feedback", () => editAssistantFeedback(index)));
        actions.appendChild(actionButton("retry", () => retryFrom(index)));
      }
      footer.appendChild(actions);
      body.appendChild(footer);
      if (message.role === "assistant" && message.feedback?.note) {
        body.appendChild(renderFeedbackNote(message.feedback));
      }

      if (documentSources.length) {
        body.appendChild(renderRagDetails(documentSources, ragDetailsKey(index)));
      }

      turn.append(avatar, body);
      return turn;
    }

    function shouldCollapseDictionaryCardsForTurn(message, index) {
      const request = message?.request || previousUserRequest(index);
      return String(request?.response_mode || "").trim() !== "dictionary";
    }

    function previousUserRequest(index) {
      const messages = activeConversation()?.messages || [];
      for (let cursor = index - 1; cursor >= 0; cursor -= 1) {
        const candidate = messages[cursor];
        if (candidate?.role === "user") return candidate.request || null;
      }
      return null;
    }

    function renderFeedbackNote(feedback) {
      const note = document.createElement("div");
      note.className = "feedback-note";
      const label = document.createElement("strong");
      label.textContent = t("feedbackLabel") + ": ";
      note.append(label, document.createTextNode(String(feedback?.note || "")));
      return note;
    }

    function renderUserRequestMeta(request) {
      const meta = document.createElement("div");
      meta.className = "user-request-meta";
      meta.textContent = formatUserRequestMeta(request);
      return meta;
    }

    function formatUserRequestMeta(request) {
      const mode = normalizeResponseMode(request.response_mode);
      const parts = [responseModeLabel(mode)];
      if (mode === "image") {
        parts.push(retrieverLabel("image-digits"));
      } else if (mode === "dictionary") {
        parts.push(retrieverLabel("dictionary-graph"));
      } else {
        const retriever = normalizeSearchChoice(request.retriever || selectedRetriever());
        parts.push(retrieverLabel(retriever));
      }
      if (mode !== "image" || request.image_rewrite) {
        parts.push(shortModelLabel(normalizeModelChoice(request.model || selectedModel())));
      }
      if (request.language) parts.push(languageLabel(request.language));
      if (request.memory === false) parts.push(t("memoryOff"));
      if (request.top_k) parts.push("top-k " + request.top_k);
      if (request.score_min !== undefined || request.score_max !== undefined) {
        const min = request.score_min === undefined ? "-inf" : request.score_min;
        const max = request.score_max === undefined ? "+inf" : request.score_max;
        parts.push("score " + min + ".." + max);
      }
      if (request.sort_by_score) parts.push(t("sortByScore"));
      if ((mode === "image" || mode === "text_image") && request.image_rewrite) parts.push(t("rewrite"));
      const commit = shortMessageCommit(request);
      if (commit) parts.push("commit " + commit);
      return parts.filter(Boolean).join(" | ");
    }

    function languageLabel(language) {
      return normalizeLanguage(language) === "vi" ? "Tiếng Việt" : "English";
    }

    function displayMessageContent(message) {
      if (message.role !== "assistant") {
        return { answer: message.content || "", thinking: [], fallback: "" };
      }
      const parsed = splitThinkContent(message.content || "");
      return {
        answer: parsed.answer,
        thinking: parsed.thinking,
        fallback: parsed.thinking.length ? t("finalAnswerMissing") : ""
      };
    }

    function copyableMessageContent(message) {
      if (message.role !== "assistant") return message.content || "";
      const parsed = splitThinkContent(message.content || "");
      return parsed.answer || "";
    }

    function renderThinkDetails(thinking) {
      const details = document.createElement("details");
      details.className = "think-details";
      const summary = document.createElement("summary");
      summary.textContent = t("reasoning");
      const text = document.createElement("div");
      text.className = "think-text";
      text.textContent = thinking.join("\n\n---\n\n");
      details.append(summary, text);
      return details;
    }

    function splitThinkContent(text) {
      const source = String(text || "");
      const thinking = [];
      const answerParts = [];
      const pattern = /<think>([\s\S]*?)(?:<\/think>|$)/gi;
      let cursor = 0;
      let match;
      while ((match = pattern.exec(source)) !== null) {
        if (match.index > cursor) answerParts.push(source.slice(cursor, match.index));
        const thought = String(match[1] || "").trim();
        if (thought) thinking.push(thought);
        cursor = pattern.lastIndex;
        if (!match[0].toLowerCase().endsWith("</think>")) {
          cursor = source.length;
          break;
        }
      }
      if (cursor < source.length) answerParts.push(source.slice(cursor));
      return {
        thinking,
        answer: answerParts.join("").trim()
      };
    }

    function actionButton(action, handler) {
      const button = document.createElement("button");
      const label = t(action);
      button.type = "button";
      button.className = "mini-action";
      button.title = label;
      button.setAttribute("aria-label", label);
      button.innerHTML = ICONS[action] || label;
      button.addEventListener("click", handler);
      return button;
    }

    function renderTextWithCitations(container, text, sources, options = {}) {
      container.textContent = "";
      container.classList.toggle("markdown-content", Boolean(options.markdown));
      const sourceByDocId = sourceLookup(sources);
      if (options.markdown) {
        renderMarkdownBlocks(container, String(text || ""), sourceByDocId);
        return;
      }
      appendInlineText(container, String(text || ""), sourceByDocId, { markdown: false });
    }

    function sourceLookup(sources) {
      const lookup = new Map();
      for (const source of sources || []) {
        for (const key of sourceLookupKeys(source)) {
          if (!lookup.has(key)) lookup.set(key, source);
        }
      }
      return lookup;
    }

    function sourceLookupKeys(source) {
      const keys = [];
      const add = (value) => {
        const text = String(value || "").trim();
        if (!text) return;
        keys.push(text);
        if (text.includes(":")) {
          const suffix = text.split(":").pop().trim();
          if (suffix) keys.push(suffix);
        }
      };
      const sourceInfo = dictionarySourceInfo(source);
      add(source?.doc_id);
      add(source?.rank);
      add(source?.source_entry_id);
      add(source?.metadata?.source_entry_id);
      add(sourceInfo.source_entry_id);
      if (sourceInfo.source_set && sourceInfo.source_entry_id) {
        add(String(sourceInfo.source_set) + ":" + String(sourceInfo.source_entry_id));
      }
      return Array.from(new Set(keys));
    }

    function renderMarkdownBlocks(container, text, sourceByDocId) {
      const normalized = String(text || "").replace(/\r\n/g, "\n");
      const lines = normalized.split("\n");
      let index = 0;
      while (index < lines.length) {
        if (!lines[index].trim()) {
          index += 1;
          continue;
        }
        const listInfo = markdownListInfo(lines[index]);
        if (listInfo) {
          const rendered = renderMarkdownList(lines, index, listInfo.indent, listInfo.ordered, sourceByDocId);
          container.appendChild(rendered.list);
          index = rendered.index;
          continue;
        }
        const heading = markdownHeading(lines[index]);
        if (heading) {
          const block = document.createElement("div");
          block.className = "md-heading";
          appendInlineText(block, heading, sourceByDocId, { markdown: true });
          container.appendChild(block);
          index += 1;
          continue;
        }
        const paragraphLines = [];
        while (index < lines.length && lines[index].trim() && !markdownListInfo(lines[index]) && !markdownHeading(lines[index])) {
          paragraphLines.push(lines[index].trim());
          index += 1;
        }
        const paragraph = document.createElement("p");
        appendInlineText(paragraph, paragraphLines.join(" "), sourceByDocId, { markdown: true });
        container.appendChild(paragraph);
      }
    }

    function renderMarkdownList(lines, startIndex, indent, ordered, sourceByDocId) {
      const list = document.createElement(ordered ? "ol" : "ul");
      let index = startIndex;
      while (index < lines.length) {
        while (index < lines.length && !lines[index].trim()) {
          const next = nextMarkdownListInfo(lines, index + 1);
          if (!next || next.indent < indent) return { list, index };
          index += 1;
        }
        const current = markdownListInfo(lines[index]);
        if (!current || current.indent !== indent || current.ordered !== ordered) break;

        const item = document.createElement("li");
        appendInlineText(item, current.text, sourceByDocId, { markdown: true });
        index += 1;

        while (index < lines.length) {
          while (index < lines.length && !lines[index].trim()) {
            const next = nextMarkdownListInfo(lines, index + 1);
            if (!next || next.indent < indent) return { list, index };
            index += 1;
          }
          const next = markdownListInfo(lines[index]);
          if (next && next.indent > indent) {
            const nested = renderMarkdownList(lines, index, next.indent, next.ordered, sourceByDocId);
            item.appendChild(nested.list);
            index = nested.index;
            continue;
          }
          if (ordered && next && !next.ordered && next.indent === indent) {
            const nested = renderMarkdownList(lines, index, next.indent, next.ordered, sourceByDocId);
            item.appendChild(nested.list);
            index = nested.index;
            continue;
          }
          break;
        }

        list.appendChild(item);
      }
      return { list, index };
    }

    function nextMarkdownListInfo(lines, startIndex) {
      for (let index = startIndex; index < lines.length; index += 1) {
        if (!lines[index].trim()) continue;
        return markdownListInfo(lines[index]);
      }
      return null;
    }

    function markdownListInfo(line) {
      const ordered = /^(\s*)\d+[.)]\s+(.+)$/.exec(line);
      if (ordered) return { ordered: true, text: ordered[2].trim(), indent: ordered[1].length };
      const unordered = /^(\s*)[-*]\s+(.+)$/.exec(line);
      if (unordered) return { ordered: false, text: unordered[2].trim(), indent: unordered[1].length };
      return null;
    }

    function markdownHeading(line) {
      const match = /^\s{0,3}#{1,4}\s+(.+?)\s*$/.exec(line);
      return match ? match[1].trim() : "";
    }

    function appendInlineText(container, text, sourceByDocId, options = {}) {
      const exactSourceReference = exactBracketedSourceReference(text, sourceByDocId);
      if (exactSourceReference) {
        container.appendChild(document.createTextNode("[" + exactSourceReference.label + "] "));
        container.appendChild(renderCitation(exactSourceReference.source));
        return;
      }
      const sourcePattern = /\[([^\[\]]+)\]/g;
      let cursor = 0;
      let match;
      while ((match = sourcePattern.exec(text)) !== null) {
        const source = sourceByDocId.get(match[1].trim());
        if (!source) continue;
        if (isDictionaryHeaderCitation(text, match.index, match.index + match[0].length)) continue;
        if (match.index > cursor) {
          appendMarkdownInline(container, text.slice(cursor, match.index), Boolean(options.markdown));
        }
        container.appendChild(renderCitation(source));
        cursor = match.index + match[0].length;
      }
      if (cursor < text.length) {
        appendMarkdownInline(container, text.slice(cursor), Boolean(options.markdown));
      }
    }

    function exactBracketedSourceReference(text, sourceByDocId) {
      const match = /^\s*\[([^\[\]]+)\]\s*$/.exec(String(text || ""));
      if (!match) return null;
      const label = match[1].trim();
      const source = sourceByDocId.get(label);
      return source ? { label, source } : null;
    }

    function isDictionaryHeaderCitation(text, start, end) {
      const source = String(text || "");
      const lineStart = source.lastIndexOf("\n", Math.max(0, start - 1)) + 1;
      const nextLine = source.indexOf("\n", end);
      const lineEnd = nextLine === -1 ? source.length : nextLine;
      const before = source.slice(lineStart, start).trim();
      const after = source.slice(end, lineEnd).trim();
      return /^(Mục từ gốc|Original entry)$/i.test(before) && after.startsWith(":");
    }

    function appendMarkdownInline(container, text, markdown) {
      if (!markdown) {
        container.appendChild(document.createTextNode(text));
        return;
      }
      const pattern = /(\*\*[^*]+?\*\*|__[^_]+?__|\*[^*\s][^*]*?\*|_[^_\s][^_]*?_)/g;
      let cursor = 0;
      let match;
      while ((match = pattern.exec(text)) !== null) {
        if (match.index > cursor) container.appendChild(document.createTextNode(text.slice(cursor, match.index)));
        const token = match[0];
        const strong = token.startsWith("**") || token.startsWith("__");
        const element = document.createElement(strong ? "strong" : "em");
        element.textContent = token.slice(strong ? 2 : 1, strong ? -2 : -1);
        container.appendChild(element);
        cursor = match.index + token.length;
      }
      if (cursor < text.length) container.appendChild(document.createTextNode(text.slice(cursor)));
    }

    function renderCitation(source) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "citation-ref" + (isSelectedSource(source) ? " active" : "");
      button.textContent = String(source.rank || "?");
      button.title = `${t("openDocument")} #${source.rank || "?"}: ${source.title || source.doc_id || t("source")}`;
      button.addEventListener("click", () => openDocument(source));
      return button;
    }

    function dictionaryAnswerParts(answer, sources, options = {}) {
      const dictionarySources = dictionaryInlineSources(answer, sources);
      if (!dictionarySources.length) return null;
      const primarySource = (sources || []).find((source) => isDictionarySource(source) && richBlocks(source).length) || dictionarySources[0];
      const text = String(answer || "").trim();
      if (!options.allowExplicitSections && hasExplicitAnswerOrSourceSections(text)) return null;
      const marker = /(?:^|\n)\s*(Giải thích|Explanation)\s*:\s*/i.exec(text);
      let explanation = "";
      if (marker) {
        explanation = text.slice(marker.index + marker[0].length).trim();
      } else if (text && !looksLikeDictionaryRawText(text, primarySource)) {
        explanation = stripDictionaryHeader(text, primarySource).trim();
      }
      return { sources: dictionarySources, explanation, collapseAll: Boolean(options.collapseAll) };
    }

    function emptyAnswerSectionParts(text) {
      const lines = String(text || "").replace(/\r\n/g, "\n").split("\n");
      const headingIndex = lines.findIndex((line) => isExplicitAnswerHeadingLine(line));
      if (headingIndex < 0) return null;
      let nextHeadingIndex = lines.length;
      for (let index = headingIndex + 1; index < lines.length; index += 1) {
        if (markdownHeading(lines[index])) {
          nextHeadingIndex = index;
          break;
        }
      }
      const body = lines.slice(headingIndex + 1, nextHeadingIndex);
      const hasBody = body.some((line) => strippedMarkdownLineText(line));
      if (hasBody) return null;
      return {
        before: lines.slice(0, headingIndex).join("\n").trim(),
        heading: markdownHeading(lines[headingIndex]) || lines[headingIndex].trim(),
        after: lines.slice(nextHeadingIndex).join("\n").trim()
      };
    }

    function isExplicitAnswerHeadingLine(line) {
      return /^\s*#{1,6}\s*(?:câu\s*trả\s*lời|cau\s*tra\s*loi|answer)\s*:?\s*$/i.test(String(line || ""));
    }

    function strippedMarkdownLineText(line) {
      return String(line || "").replace(/^\s*(?:[-*]|\d+[.)])\s*/, "").trim();
    }

    function hasExplicitAnswerOrSourceSections(text) {
      const source = String(text || "");
      return /^\s*#{1,6}\s*(?:câu\s*trả\s*lời|cau\s*tra\s*loi|answer|nguồn|nguon|sources?|references?)\s*:?\s*$/im.test(source);
    }

    function renderDictionaryAnswer(parts) {
      const sources = parts.sources || (parts.source ? [parts.source] : []);
      const options = { collapseAll: Boolean(parts.collapseAll) };
      if (sources.length > 1) {
        const list = document.createElement("div");
        list.className = "dictionary-inline-list";
        for (const source of sources) {
          list.appendChild(renderDictionaryCard(source, options));
        }
        return list;
      }
      return renderDictionaryCard(sources[0], options);
    }

    function renderDictionaryCard(source, options = {}) {
      const card = document.createElement("section");
      const relevance = dictionaryRelevance(source);
      const collapsed = Boolean(options.collapseAll) || relevance === "related";
      card.className = "dictionary-inline" + (collapsed ? " dictionary-inline-related" : "");
      const head = document.createElement("div");
      head.className = "dictionary-inline-head";
      const title = document.createElement("div");
      title.className = "dictionary-inline-title";
      const strong = document.createElement("strong");
      strong.textContent = source.title || source.doc_id || t("dictionary");
      const meta = document.createElement("div");
      meta.className = "dictionary-inline-meta";
      if (showDebugSourceMetadata()) {
        const metaText = document.createElement("span");
        metaText.className = "dictionary-inline-meta-text";
        const score = typeof source.score === "number" ? " · score " + source.score.toFixed(3) : "";
        metaText.textContent = (source.doc_id || t("source")) + score;
        meta.appendChild(metaText);
      }
      meta.appendChild(renderDictionaryRelevance(source, relevance));
      title.append(strong, meta);
      const open = document.createElement("button");
      open.type = "button";
      open.className = "dictionary-open";
      open.textContent = dictionarySourceLabel(source);
      open.title = `${t("openDocument")}: ${dictionarySourceLabel(source)}`;
      open.addEventListener("click", () => openDocument(source));
      head.append(title, open);
      const graphPath = renderDictionaryGraphPath(source);
      const body = document.createElement("div");
      body.className = "dictionary-inline-body";
      const blocks = richBlocks(source);
      const highlightOptions = { strictHighlights: dictionaryMatchMode(source) === "strict" };
      if (blocks.length) {
        renderRichBlocks(body, blocks, sourceHighlightTerms(source), highlightOptions);
      } else {
        appendHighlightedText(body, dictionaryDisplayText(source) || t("noDocumentText"), sourceHighlightTerms(source), highlightOptions);
      }
      if (graphPath) {
        graphPath.style.padding = "0 14px";
      }
      card.append(head);
      if (graphPath) card.appendChild(graphPath);
      if (collapsed) {
        const details = document.createElement("details");
        details.className = "dictionary-related-details";
        const summary = document.createElement("summary");
        const label = document.createElement("span");
        label.className = "dictionary-related-summary-label";
        label.textContent = relevance === "related" ? t("expandRelatedDictionary") : t("expandDictionaryDefinition");
        summary.appendChild(label);
        details.append(summary, body);
        card.appendChild(details);
      } else {
        card.appendChild(body);
      }
      return card;
    }

    function renderDictionaryRelevance(source, knownRelevance) {
      const relevance = knownRelevance || dictionaryRelevance(source);
      const pill = document.createElement("span");
      pill.className = "dictionary-relevance " + relevance;
      pill.textContent = relevance === "match" ? t("match") : t("related");
      return pill;
    }

    function dictionaryRelevance(source) {
      const directScore = Number(source?.dictionary_direct_score || source?.metadata?.dictionary_direct_score || 0);
      return sourceHighlightTerms(source).length || directScore > 0 ? "match" : "related";
    }

    function dictionaryMatchMode(source) {
      return String(source?.dictionary_match_mode || source?.metadata?.dictionary_match_mode || "");
    }

    function dictionaryGraphPath(source) {
      const path = source?.dictionary_graph_path || source?.metadata?.dictionary_graph_path || [];
      return Array.isArray(path) ? path : [];
    }

    function renderDictionaryGraphPath(source) {
      const path = dictionaryGraphPath(source);
      if (!path.length) return null;
      const wrap = document.createElement("div");
      wrap.className = "dictionary-graph-path";
      path.forEach((item, index) => {
        const normalized = normalizeDictionaryGraphPathItem(item);
        if (!normalized.label) return;
        if (index > 0) {
          const arrow = document.createElement("span");
          arrow.className = "dictionary-graph-relation";
          arrow.textContent = ">";
          wrap.appendChild(arrow);
        }
        if (normalized.type === "relation") {
          const relation = document.createElement("span");
          relation.className = "dictionary-graph-relation";
          relation.textContent = dictionaryRelationLabel(normalized.label);
          wrap.appendChild(relation);
          return;
        }
        if (normalized.type === "entry") {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "dictionary-graph-node";
          button.textContent = normalized.label;
          button.title = `${t("openDocument")}: ${normalized.label}`;
          button.addEventListener("click", (event) => {
            event.preventDefault();
            event.stopPropagation();
            openDictionaryCrossReference(normalized.label, event.currentTarget);
          });
          wrap.appendChild(button);
          return;
        }
        const node = document.createElement("span");
        node.className = "dictionary-graph-node";
        node.textContent = normalized.label;
        wrap.appendChild(node);
      });
      return wrap.childElementCount ? wrap : null;
    }

    function normalizeDictionaryGraphPathItem(item) {
      if (item && typeof item === "object") {
        return {
          type: String(item.type || "node"),
          id: String(item.id || ""),
          label: String(item.label || item.id || "").trim()
        };
      }
      return { type: "node", id: "", label: String(item || "").trim() };
    }

    function dictionaryRelationLabel(label) {
      return String(label || "").replace(/_/g, " ");
    }

    function dictionaryInlineSources(answer, sources) {
      const dictionarySources = (sources || []).filter(isDictionaryDisplaySource);
      if (!dictionarySources.length) return [];
      const cited = citedSources(answer, dictionarySources);
      const citedKeys = new Set(cited.map(sourceKey));
      const priority = [
        ...dictionarySources.filter((source) => citedKeys.has(sourceKey(source))),
        ...dictionarySources.filter((source) => !citedKeys.has(sourceKey(source)))
      ];
      const seen = new Set();
      const selected = [];
      for (const source of priority) {
        const key = sourceKey(source);
        if (seen.has(key)) continue;
        seen.add(key);
        selected.push(source);
        if (selected.length >= MAX_INLINE_DICTIONARY_SOURCES) break;
      }
      return selected;
    }

    function citedSources(answer, sources) {
      const lookup = sourceLookup(sources);
      const selected = [];
      const seen = new Set();
      const pattern = /\[([^\[\]]+)\]/g;
      let match;
      while ((match = pattern.exec(String(answer || ""))) !== null) {
        const source = lookup.get(match[1].trim());
        if (!source) continue;
        const key = sourceKey(source);
        if (seen.has(key)) continue;
        seen.add(key);
        selected.push(source);
      }
      return selected;
    }

    function sourceKey(source) {
      return String(source?.doc_id || "") + "#" + String(source?.rank || "");
    }

    function isDictionarySource(source) {
      return source?.kind === "dictionary" || source?.metadata?.kind === "dictionary" || richBlocks(source).length > 0;
    }

    function isDictionaryDisplaySource(source) {
      return isDictionarySource(source) && (richBlocks(source).length > 0 || Boolean(dictionaryDisplayText(source)));
    }

    function dictionaryDisplayText(source) {
      return String(
        source?.raw_docx_text ||
        source?.metadata?.raw_docx_text ||
        source?.text ||
        source?.metadata?.text ||
        ""
      ).trim();
    }

    function dictionarySourceLabel(source) {
      const sourceInfo = dictionarySourceInfo(source);
      const sourceSet = String(sourceInfo.source_set || "").toLowerCase();
      const sourceFile = String(sourceInfo.source_file || "");
      const entryId = String(sourceInfo.source_entry_id || source?.doc_id || "").trim();
      const isSupplement = sourceSet === "supp2021" || /bổ sung|bo sung|supp/i.test(sourceFile);
      const parts = [currentLanguage() === "vi" ? "Từ điển PB 2021" : "PB Dictionary 2021"];
      if (isSupplement) parts.push(currentLanguage() === "vi" ? "Bổ sung 2021" : "2021 supplement");
      if (entryId) parts.push(entryId);
      return parts.join(" · ");
    }

    function dictionarySourceInfo(source) {
      const info = source?.source || source?.metadata?.source || {};
      return info && typeof info === "object" ? info : {};
    }

    function stripDictionaryHeader(text, source) {
      const docId = escapeRegExp(String(source?.doc_id || ""));
      const sourcePattern = docId
        ? new RegExp("^\\s*(?:Mục từ gốc|Original entry)\\s*\\[(?:" + docId + "|[^\\]]+)\\]\\s*:\\s*", "i")
        : /^\s*(?:Mục từ gốc|Original entry)\s*(?:\[[^\]]+\])?\s*:\s*/i;
      return String(text || "").replace(sourcePattern, "");
    }

    function looksLikeDictionaryRawText(text, source) {
      const stripped = stripDictionaryHeader(text, source);
      const sourceText = String(source?.raw_docx_text || source?.metadata?.raw_docx_text || source?.text || "");
      return comparableText(stripped).startsWith(comparableText(sourceText).slice(0, 80));
    }

    function comparableText(value) {
      return String(value || "").replace(/\s+/g, " ").trim().toLowerCase();
    }

    function escapeRegExp(value) {
      return String(value).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function renderImageGrid(sources) {
      const grid = document.createElement("div");
      grid.className = "image-grid";
      for (const source of sources) {
        const image = imageSource(source);
        if (!image) continue;
        const card = document.createElement("button");
        card.type = "button";
        card.className = "image-card";
        card.title = source.title || source.doc_id || t("source");
        const img = document.createElement("img");
        img.src = image;
        img.alt = source.title || source.doc_id || t("source");
        const caption = document.createElement("div");
        caption.className = "image-caption";
        const label = source.label !== undefined && source.label !== null ? " · label " + source.label : "";
        caption.textContent = "#" + (source.rank || "-") + label;
        card.append(img, caption);
        card.addEventListener("click", () => openImageLightbox(source));
        grid.appendChild(card);
      }
      return grid;
    }

    function renderSources(sources) {
      const list = document.createElement("div");
      list.className = "source-list";
      for (const source of sources) {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "source-chip" + (isSelectedSource(source) ? " active" : "");
        chip.textContent = source.doc_id || t("source");
        chip.title = source.title || source.doc_id || t("source");
        chip.addEventListener("click", () => openDocument(source));
        list.appendChild(chip);
      }
      return list;
    }

    function ragDetailsKey(index) {
      const conversation = activeConversation();
      return (conversation?.id || "chat") + ":" + index;
    }

    function renderRagDetails(sources, detailsKey) {
      const details = document.createElement("details");
      details.className = "rag-details";
      if (ragDetailsOpen.has(detailsKey)) {
        details.open = Boolean(ragDetailsOpen.get(detailsKey));
      }
      details.addEventListener("toggle", () => {
        ragDetailsOpen.set(detailsKey, details.open);
      });
      const summary = document.createElement("summary");
      summary.textContent = t("retrievedContext");
      const table = document.createElement("div");
      table.className = "rag-table";
      for (const source of sources) {
        const row = document.createElement("button");
        row.type = "button";
        const image = imageSource(source);
        row.className = "rag-row" + (image ? " has-thumb" : "") + (isSelectedSource(source) ? " active" : "");
        row.title = t("openDocument");
        row.addEventListener("click", () => openDocument(source));
        const rank = document.createElement("div");
        rank.textContent = "#" + (source.rank || "-");
        if (image) {
          const thumb = document.createElement("img");
          thumb.className = "rag-thumb";
          thumb.src = image;
          thumb.alt = source.title || source.doc_id || t("source");
          row.append(rank, thumb);
        } else {
          row.appendChild(rank);
        }
        const title = document.createElement("div");
        title.className = "rag-title";
        const score = showDebugSourceMetadata() && typeof source.score === "number" ? " | score " + source.score.toFixed(3) : "";
        title.textContent = (source.title || source.doc_id || t("source")) + score;
        row.appendChild(title);
        table.appendChild(row);
      }
      details.append(summary, table);
      return details;
    }

    function openDocument(source, options = {}) {
      closeDictionaryCrossReferencePopup();
      if (options.fromCrossRef) {
        if (selectedSource && !sameDocumentSource(selectedSource, source)) {
          pushDocumentTrail(selectedSource);
        }
      } else if (!options.preserveTrail) {
        documentTrail = [];
      }
      selectedSource = source;
      renderDocumentPanel(source);
      app.classList.add("doc-open");
      renderChat();
    }

    function closeDocPanel() {
      closeDictionaryCrossReferencePopup();
      selectedSource = null;
      documentTrail = [];
      app.classList.remove("doc-open");
      docTitle.textContent = t("document");
      docSubtitle.textContent = t("retrievedContext");
      docMeta.textContent = "";
      renderDocumentTrail(null);
      docText.textContent = "";
      docText.classList.add("plain");
      docText.classList.remove("xref-ready");
      docText.removeAttribute("title");
      docImageWrap.classList.remove("show");
      docImage.removeAttribute("src");
      docImage.alt = "";
      renderChat();
    }

    function renderDocumentPanel(source) {
      const docId = source.doc_id || t("source");
      const dictionarySource = isDictionarySource(source);
      docTitle.textContent = source.title || docId;
      docSubtitle.textContent = dictionarySource ? dictionarySourceLabel(source) : docId;
      docMeta.textContent = "";
      const metaItems = showDebugSourceMetadata()
        ? [
            dictionarySource ? docId : null,
            source.rank ? "rank #" + source.rank : null,
            typeof source.score === "number" ? "score " + source.score.toFixed(3) : null
          ].filter(Boolean)
        : [];
      for (const item of metaItems) {
        const pill = document.createElement("span");
        pill.className = "doc-pill";
        pill.textContent = item;
        docMeta.appendChild(pill);
      }
      const graphPath = dictionarySource ? renderDictionaryGraphPath(source) : null;
      if (graphPath) docMeta.appendChild(graphPath);
      renderDocumentTrail(source);
      const image = imageSource(source);
      if (image) {
        docImage.src = image;
        docImage.alt = source.title || docId;
        docImageWrap.classList.add("show");
      } else {
        docImageWrap.classList.remove("show");
        docImage.removeAttribute("src");
        docImage.alt = "";
      }
      const crossRefsEnabled = dictionarySource && Boolean(settings.dictionaryCrossRef);
      docText.classList.toggle("xref-ready", crossRefsEnabled);
      if (crossRefsEnabled) {
        docText.title = t("dictionaryCrossRefHint");
      } else {
        docText.removeAttribute("title");
      }
      renderDocumentText(source);
    }

    function showDebugSourceMetadata() {
      return Boolean(settings.devMode);
    }

    function renderDocumentText(source) {
      docText.textContent = "";
      if (source?.redacted) {
        docText.classList.add("plain");
        docText.textContent = source.text_redaction_reason ? t("privateSourceRedacted") : t("noDocumentText");
        return;
      }
      const blocks = richBlocks(source);
      const crossRefsEnabled = isDictionarySource(source) && Boolean(settings.dictionaryCrossRef);
      const highlightOptions = {
        crossRefs: crossRefsEnabled,
        strictHighlights: dictionaryMatchMode(source) === "strict"
      };
      if (blocks.length) {
        docText.classList.remove("plain");
        renderRichBlocks(docText, blocks, sourceHighlightTerms(source), highlightOptions);
        return;
      }
      docText.classList.add("plain");
      appendHighlightedText(
        docText,
        source.text || source.raw_docx_text || source.metadata?.raw_docx_text || t("noDocumentText"),
        sourceHighlightTerms(source),
        highlightOptions
      );
    }

    async function onDocumentTextClick(event) {
      if (!settings.dictionaryCrossRef) return;
      if (!isDictionarySource(selectedSource)) return;
      const explicit = event.target.closest("[data-dictionary-xref]");
      const term = explicit?.dataset.dictionaryXref || clickedDictionaryTerm(event);
      if (!term) return;
      event.preventDefault();
      event.stopPropagation();
      await openDictionaryCrossReference(term, explicit || event);
    }

    async function onDocumentTextKeydown(event) {
      if (!settings.dictionaryCrossRef) return;
      if (!isDictionarySource(selectedSource)) return;
      if (event.key !== "Enter" && event.key !== " ") return;
      const explicit = event.target.closest("[data-dictionary-xref]");
      if (!explicit?.dataset.dictionaryXref) return;
      event.preventDefault();
      event.stopPropagation();
      await openDictionaryCrossReference(explicit.dataset.dictionaryXref, explicit);
    }

    async function openDictionaryCrossReference(term, anchor) {
      const query = String(term || "").trim();
      if (!query) return;
      const requestId = ++dictionaryXrefRequestId;
      renderDictionaryCrossReferencePopup(query, [], { loading: true });
      placeDictionaryCrossReferencePopup(anchor);
      try {
        const sources = await fetchDictionaryLookup(query, 5);
        if (requestId !== dictionaryXrefRequestId) return;
        if (!sources.length) {
          renderDictionaryCrossReferencePopup(query, [], { empty: true });
          placeDictionaryCrossReferencePopup(anchor);
          showNotice(t("dictionaryLookupEmpty") + query);
          return;
        }
        renderDictionaryCrossReferencePopup(query, sources);
        placeDictionaryCrossReferencePopup(anchor);
      } catch (error) {
        if (requestId !== dictionaryXrefRequestId) return;
        closeDictionaryCrossReferencePopup();
        showNotice(t("dictionaryLookupError") + error.message);
      }
    }

    function renderDictionaryCrossReferencePopup(term, sources, options = {}) {
      dictionaryXrefPopover.textContent = "";
      const head = document.createElement("div");
      head.className = "dictionary-xref-head";
      const title = document.createElement("div");
      title.className = "dictionary-xref-title";
      title.textContent = `${t("dictionaryCrossRefResults")}: ${term}`;
      const close = document.createElement("button");
      close.type = "button";
      close.className = "icon-btn";
      close.title = "Close";
      close.setAttribute("aria-label", "Close");
      close.innerHTML = '<svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>';
      close.addEventListener("click", closeDictionaryCrossReferencePopup);
      head.append(title, close);
      dictionaryXrefPopover.appendChild(head);

      const list = document.createElement("div");
      list.className = "dictionary-xref-list";
      if (options.loading || options.empty || !sources.length) {
        const empty = document.createElement("div");
        empty.className = "dictionary-xref-empty";
        empty.textContent = options.loading ? t("dictionaryCrossRefLoading") : t("dictionaryLookupEmpty") + term;
        list.appendChild(empty);
      } else {
        sources.slice(0, 5).forEach((source) => {
          list.appendChild(renderDictionaryCrossReferenceItem(source));
        });
      }
      dictionaryXrefPopover.appendChild(list);
      dictionaryXrefPopover.hidden = false;
      const first = dictionaryXrefPopover.querySelector(".dictionary-xref-item");
      if (first) first.focus({ preventScroll: true });
    }

    function renderDictionaryCrossReferenceItem(source) {
      const item = document.createElement("button");
      item.type = "button";
      item.className = "dictionary-xref-item";
      const title = document.createElement("div");
      title.className = "dictionary-xref-item-title";
      title.textContent = source.title || source.doc_id || t("dictionary");
      const meta = document.createElement("div");
      meta.className = "dictionary-xref-item-meta";
      const parts = [dictionarySourceLabel(source)];
      if (showDebugSourceMetadata() && typeof source.score === "number") {
        parts.push("score " + source.score.toFixed(3));
      }
      meta.textContent = parts.filter(Boolean).join(" · ");
      item.append(title, meta);
      item.addEventListener("click", () => openDocument(source, { fromCrossRef: true }));
      return item;
    }

    function placeDictionaryCrossReferencePopup(anchor) {
      const rect = dictionaryCrossReferenceAnchorRect(anchor);
      const margin = 12;
      const width = Math.min(360, Math.max(240, window.innerWidth - margin * 2));
      dictionaryXrefPopover.style.width = width + "px";
      dictionaryXrefPopover.style.left = "0px";
      dictionaryXrefPopover.style.top = "0px";
      dictionaryXrefPopover.hidden = false;
      const popoverRect = dictionaryXrefPopover.getBoundingClientRect();
      let left = rect.left;
      let top = rect.bottom + 8;
      if (left + width > window.innerWidth - margin) left = window.innerWidth - width - margin;
      if (left < margin) left = margin;
      if (top + popoverRect.height > window.innerHeight - margin) {
        top = rect.top - popoverRect.height - 8;
      }
      if (top < margin) top = margin;
      dictionaryXrefPopover.style.left = Math.round(left) + "px";
      dictionaryXrefPopover.style.top = Math.round(top) + "px";
    }

    function dictionaryCrossReferenceAnchorRect(anchor) {
      if (anchor?.getBoundingClientRect) return anchor.getBoundingClientRect();
      if (anchor && Number.isFinite(anchor.clientX) && Number.isFinite(anchor.clientY)) {
        return {
          left: anchor.clientX,
          right: anchor.clientX,
          top: anchor.clientY,
          bottom: anchor.clientY,
          width: 0,
          height: 0
        };
      }
      const fallback = docText.getBoundingClientRect();
      return {
        left: fallback.left + 24,
        right: fallback.left + 24,
        top: fallback.top + 24,
        bottom: fallback.top + 24,
        width: 0,
        height: 0
      };
    }

    function closeDictionaryCrossReferencePopup() {
      dictionaryXrefRequestId += 1;
      dictionaryXrefPopover.hidden = true;
      dictionaryXrefPopover.textContent = "";
    }

    function pushDocumentTrail(source) {
      if (!source) return;
      if (documentTrail.length && sameDocumentSource(documentTrail[documentTrail.length - 1], source)) return;
      documentTrail = [...documentTrail, source].slice(-8);
    }

    function openDocumentFromTrail(index) {
      const source = documentTrail[index];
      if (!source) return;
      documentTrail = documentTrail.slice(0, index);
      selectedSource = source;
      renderDocumentPanel(source);
      app.classList.add("doc-open");
      renderChat();
    }

    function renderDocumentTrail(source) {
      docTrail.textContent = "";
      if (!source || !documentTrail.length) {
        docTrail.hidden = true;
        return;
      }
      docTrail.hidden = false;
      const label = document.createElement("span");
      label.className = "doc-trail-label";
      label.textContent = t("referenceTrail");
      docTrail.appendChild(label);
      documentTrail.forEach((item, index) => {
        const separator = document.createElement("span");
        separator.className = "doc-trail-separator";
        separator.textContent = "/";
        docTrail.appendChild(separator);
        const button = document.createElement("button");
        button.type = "button";
        button.className = "doc-trail-link";
        button.textContent = dictionaryTrailLabel(item);
        button.title = t("backToPreviousEntry") + ": " + dictionaryTrailLabel(item);
        button.addEventListener("click", () => openDocumentFromTrail(index));
        docTrail.appendChild(button);
      });
      const separator = document.createElement("span");
      separator.className = "doc-trail-separator";
      separator.textContent = "/";
      const current = document.createElement("span");
      current.className = "doc-trail-current";
      current.textContent = dictionaryTrailLabel(source);
      docTrail.append(separator, current);
    }

    function dictionaryTrailLabel(source) {
      return String(source?.title || source?.doc_id || t("dictionary")).trim();
    }

    function sameDocumentSource(left, right) {
      const leftId = documentSourceIdentity(left);
      const rightId = documentSourceIdentity(right);
      return Boolean(leftId && rightId && leftId === rightId);
    }

    function documentSourceIdentity(source) {
      const sourceInfo = dictionarySourceInfo(source);
      return String(
        source?.doc_id ||
        source?.source_entry_id ||
        source?.metadata?.source_entry_id ||
        sourceInfo.source_entry_id ||
        sourceKey(source)
      ).trim();
    }

    async function fetchDictionaryLookup(term, topK = 5) {
      const response = await fetch("/v1/dictionary/lookup", {
        method: "POST",
        headers: apiHeaders(),
        body: JSON.stringify({ term, top_k: topK })
      });
      if (!response.ok) {
        throw new Error(await responseError(response));
      }
      const data = await response.json();
      const sources = Array.isArray(data.retrieved) ? data.retrieved : [];
      return sources;
    }

    function clickedDictionaryTerm(event) {
      const selection = window.getSelection?.();
      if (selection && !selection.isCollapsed && selection.anchorNode && docText.contains(selection.anchorNode)) {
        return sanitizeDictionaryTerm(selection.toString());
      }
      const caret = caretFromPoint(event.clientX, event.clientY);
      if (!caret || !caret.node || caret.node.nodeType !== Node.TEXT_NODE || !docText.contains(caret.node)) return "";
      return tokenAtOffset(caret.node.textContent || "", caret.offset);
    }

    function caretFromPoint(x, y) {
      if (document.caretPositionFromPoint) {
        const position = document.caretPositionFromPoint(x, y);
        return position ? { node: position.offsetNode, offset: position.offset } : null;
      }
      if (document.caretRangeFromPoint) {
        const range = document.caretRangeFromPoint(x, y);
        return range ? { node: range.startContainer, offset: range.startOffset } : null;
      }
      return null;
    }

    function tokenAtOffset(text, offset) {
      const value = String(text || "");
      if (!value) return "";
      let cursor = Math.max(0, Math.min(Number(offset) || 0, value.length));
      if (cursor > 0 && !isDictionaryTermChar(value.charAt(cursor)) && isDictionaryTermChar(value.charAt(cursor - 1))) {
        cursor -= 1;
      }
      let start = cursor;
      while (start > 0 && isDictionaryTermChar(value.charAt(start - 1))) start -= 1;
      let end = cursor;
      while (end < value.length && isDictionaryTermChar(value.charAt(end))) end += 1;
      return sanitizeDictionaryTerm(value.slice(start, end));
    }

    function isDictionaryTermChar(char) {
      return Boolean(char) && /[\p{L}\p{M}\p{N}_-]/u.test(char);
    }

    function sanitizeDictionaryTerm(value) {
      const cleaned = String(value || "").replace(/\s+/g, " ").trim().replace(/^[._-]+|[._-]+$/g, "");
      return cleaned.length >= 2 ? cleaned.slice(0, 120) : "";
    }

    function richBlocks(source) {
      const blocks = source?.rich_blocks || source?.metadata?.rich_blocks || [];
      return Array.isArray(blocks) ? blocks.filter((block) => block && typeof block === "object") : [];
    }

    function sourceHighlightTerms(source) {
      const terms = source?.query_highlights || source?.metadata?.query_highlights || [];
      if (!Array.isArray(terms)) return [];
      return terms.map((term) => String(term || "").trim()).filter(Boolean);
    }

    function renderRichBlocks(container, blocks, highlights = [], options = {}) {
      const wrapper = document.createElement("div");
      wrapper.className = "rich-block";
      for (const block of blocks) {
        if (block.type === "table_row") {
          wrapper.appendChild(renderRichTableRow(block, highlights, options));
        } else if (block.type === "paragraph") {
          wrapper.appendChild(renderRichParagraph(block, highlights, options));
        }
      }
      container.appendChild(wrapper);
    }

    function renderRichTableRow(block, highlights = [], options = {}) {
      const row = document.createElement("div");
      row.className = "rich-table-row";
      const cells = Array.isArray(block.cells) ? block.cells : [];
      for (const cell of cells) {
        const cellElement = document.createElement("div");
        cellElement.className = "rich-table-cell";
        const paragraphs = Array.isArray(cell.paragraphs) ? cell.paragraphs : [];
        for (const paragraph of paragraphs) {
          cellElement.appendChild(renderRichParagraph(paragraph, highlights, options));
        }
        row.appendChild(cellElement);
      }
      if (!cells.length && block.text) appendHighlightedText(row, block.text, highlights, options);
      return row;
    }

    function renderRichParagraph(paragraph, highlights = [], options = {}) {
      const element = document.createElement("div");
      element.className = "rich-paragraph";
      const runs = Array.isArray(paragraph.runs) ? paragraph.runs : [];
      if (!runs.length) {
        appendHighlightedText(element, paragraph.text || paragraph.plain_text || "", highlights, options);
        return element;
      }
      for (const run of runs) {
